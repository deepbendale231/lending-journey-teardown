[project]
name = "lending-journey-teardown"
version = "1.0.0"
description = "Personal loan journey teardown: friction log, RBI checklist, RICE, PRD and an experiment plan, with tooling that computes every headline number"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B905", "RUF005", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["tools"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
