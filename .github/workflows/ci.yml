name: ci
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - name: Tests with coverage gate (fail under 90%)
        run: pytest -q --cov --cov-report=term-missing
      - name: "Evidence consistency: RICE scores, screenshot index, generated blocks"
        run: python -m tools.rice --check && python -m tools.check
